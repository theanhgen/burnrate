<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>burnrate — see where your AI budget goes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* burnrate landing — light neutral background, warm flame accent */

:root {
  --bg: #fafaf7;
  --bg-2: #f3f2ed;
  --ink: #14110e;
  --ink-2: #5a544c;
  --ink-3: #8a8377;
  --line: rgba(20, 17, 14, 0.08);
  --line-strong: rgba(20, 17, 14, 0.16);
  --accent: #ea580c;
  --accent-2: #f97316;
  --accent-soft: #fed7aa;
  --card: #ffffff;
  --shadow-sm: 0 1px 2px rgba(20,17,14,0.04), 0 1px 0 rgba(20,17,14,0.03);
  --shadow-md: 0 8px 24px rgba(20,17,14,0.06), 0 2px 6px rgba(20,17,14,0.04);
  --shadow-lg: 0 24px 60px rgba(20,17,14,0.10), 0 8px 20px rgba(20,17,14,0.06);
  --radius: 14px;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'cv11', 'ss01';
  letter-spacing: -0.01em;
}

button { font-family: inherit; cursor: pointer; }

/* ========== Layout ========== */
.page {
  min-height: 100vh;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(234,88,12,0.06), transparent 70%),
    var(--bg);
}
.shell {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 28px;
}

/* ========== Nav ========== */
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 28px;
  max-width: 1080px;
  margin: 0 auto;
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -0.02em;
}
.nav-flame {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  display: grid;
  place-items: center;
  color: white;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 1px 2px rgba(234,88,12,0.3);
}
.nav-links {
  display: flex;
  gap: 28px;
  font-size: 13px;
  color: var(--ink-2);
}
.nav-links a {
  color: inherit;
  text-decoration: none;
  transition: color 0.15s;
}
.nav-links a:hover { color: var(--ink); }
.nav-cta {
  background: var(--ink);
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.nav-cta:hover { background: #2a241e; }

/* ========== Hero ========== */
.hero {
  padding: 56px 0 80px;
  text-align: center;
  position: relative;
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 100px;
  background: rgba(234,88,12,0.08);
  color: var(--accent);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0;
  margin-bottom: 24px;
  font-family: var(--mono);
}
.hero-eyebrow .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(234,88,12,0.2);
}

/* Flame row decoration */
.flame-row {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-bottom: 28px;
  opacity: 0.85;
}
.flame-row svg {
  width: 22px;
  height: 22px;
}
.flame-row svg:nth-child(odd) { transform: rotate(-4deg); }
.flame-row svg:nth-child(even) { transform: rotate(3deg); }

.hero h1 {
  font-size: clamp(48px, 8vw, 88px);
  font-weight: 600;
  letter-spacing: -0.04em;
  line-height: 0.95;
  margin: 0 0 20px;
  font-feature-settings: 'ss01';
}
.hero-sub {
  font-size: 19px;
  line-height: 1.5;
  color: var(--ink-2);
  max-width: 540px;
  margin: 0 auto 36px;
  letter-spacing: -0.012em;
}
.hero-sub b { color: var(--ink); font-weight: 500; }

.hero-ctas {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.appstore-btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 11px 22px 11px 18px;
  background: #000;
  color: #fff;
  border-radius: 12px;
  text-decoration: none;
  border: none;
  transition: transform 0.1s;
}
.appstore-btn:hover { transform: translateY(-1px); }
.appstore-btn .as-icon {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  width: 24px;
  height: 24px;
}
.appstore-btn .as-text {
  display: flex;
  flex-direction: column;
  text-align: left;
  line-height: 1.1;
}
.appstore-btn .as-small {
  font-size: 9px;
  letter-spacing: 0.03em;
  opacity: 0.85;
}
.appstore-btn .as-big {
  font-size: 16px;
  font-weight: 500;
  letter-spacing: -0.01em;
}

.brew-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  background: var(--card);
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--ink);
  transition: all 0.15s;
  cursor: pointer;
}
.brew-btn:hover { border-color: var(--ink); }
.brew-btn .brew-prompt { color: var(--accent); font-weight: 600; }
.brew-btn .brew-copy {
  margin-left: 6px;
  color: var(--ink-3);
  font-size: 11px;
  padding-left: 10px;
  border-left: 1px solid var(--line);
}
.brew-btn.copied .brew-copy { color: var(--accent); }

.hero-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 18px;
  letter-spacing: 0;
}
.hero-meta span + span::before {
  content: '·';
  margin: 0 10px;
  color: var(--line-strong);
}

/* ========== Hero stage ========== */
.hero-stage {
  margin-top: 56px;
  position: relative;
  height: 540px;
  display: flex;
  justify-content: center;
}
.macbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 26px;
  background: linear-gradient(180deg, rgba(20,17,14,0.95), rgba(20,17,14,0.85));
  backdrop-filter: blur(20px);
  border-radius: 14px 14px 0 0;
  display: flex;
  align-items: center;
  padding: 0 14px;
  font-size: 11px;
  color: rgba(255,255,255,0.85);
  font-weight: 500;
  letter-spacing: -0.01em;
  border: 1px solid rgba(0,0,0,0.2);
  border-bottom: none;
}
.macbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.macbar-apple {
  font-size: 13px;
  line-height: 1;
}
.macbar-app { font-weight: 600; }
.macbar-menu { opacity: 0.7; font-weight: 400; }
.macbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--mono);
  font-size: 10px;
  color: rgba(255,255,255,0.7);
}
.macbar-burnrate {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px;
  background: rgba(234,88,12,0.18);
  border-radius: 5px;
  color: #ffba7a;
  position: relative;
}
.macbar-burnrate::before {
  content: '';
  position: absolute;
  inset: -1px;
  border: 1px solid rgba(234,88,12,0.5);
  border-radius: 6px;
  pointer-events: none;
}
.macbar-burnrate .flame-mini { font-size: 10px; }

/* desktop wallpaper hint */
.desktop {
  position: absolute;
  inset: 26px 0 0 0;
  background:
    radial-gradient(ellipse at 30% 30%, rgba(234,88,12,0.08), transparent 50%),
    radial-gradient(ellipse at 70% 70%, rgba(124, 58, 237, 0.06), transparent 50%),
    linear-gradient(180deg, #f0ede6, #e8e4db);
  border: 1px solid var(--line);
  border-top: none;
  border-radius: 0 0 14px 14px;
  overflow: hidden;
}
.desktop::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(20,17,14,0.05) 1px, transparent 0);
  background-size: 24px 24px;
  opacity: 0.4;
}

.popover-anchor {
  position: absolute;
  top: 38px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
}

/* ========== Menu Bar Mockup ========== */
.mbm-wrap { position: relative; filter: drop-shadow(0 30px 60px rgba(0,0,0,0.35)); }
.mbm-tail {
  position: absolute;
  top: -7px;
  left: 50%;
  transform: translateX(-50%) rotate(45deg);
  width: 14px;
  height: 14px;
  background: rgba(28, 22, 32, 0.92);
  backdrop-filter: blur(40px);
  border-left: 1px solid rgba(255,255,255,0.08);
  border-top: 1px solid rgba(255,255,255,0.08);
}
.mbm-popover {
  width: 380px;
  background: rgba(28, 22, 32, 0.86);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  color: rgba(255,255,255,0.92);
  overflow: hidden;
  font-size: 12px;
  position: relative;
}
.mbm-popover::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(124,58,237,0.06), rgba(234,88,12,0.04));
  pointer-events: none;
  border-radius: 14px;
}
.mbm-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 14px 12px;
  position: relative;
}
.mbm-brand { display: flex; align-items: center; gap: 8px; }
.mbm-logo {
  width: 22px; height: 22px;
  border-radius: 6px;
  background: linear-gradient(135deg, #f97316, #ea580c);
  display: grid; place-items: center;
  color: white;
  box-shadow: 0 2px 6px rgba(234,88,12,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
}
.mbm-title {
  font-weight: 600;
  font-size: 13px;
  letter-spacing: -0.01em;
}
.mbm-cycle {
  font-family: var(--mono);
  font-size: 10px;
  color: rgba(255,255,255,0.45);
  margin-left: 6px;
}
.mbm-controls { display: flex; gap: 4px; }
.mbm-btn-icon {
  width: 24px; height: 24px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 6px;
  color: rgba(255,255,255,0.7);
  display: grid; place-items: center;
}
.mbm-btn-icon:hover { background: rgba(255,255,255,0.1); }

.mbm-aggregate {
  padding: 4px 16px 14px;
  position: relative;
}
.mbm-agg-num {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.mbm-agg-spend {
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: white;
  font-feature-settings: 'tnum';
}
.mbm-agg-cents { color: rgba(255,255,255,0.5); font-size: 18px; }
.mbm-agg-of {
  font-family: var(--mono);
  font-size: 11px;
  color: rgba(255,255,255,0.45);
}
.mbm-agg-bar {
  height: 6px;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.mbm-agg-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, #f97316, #ea580c);
  box-shadow: 0 0 12px rgba(234,88,12,0.5);
}
.mbm-agg-pace {
  position: absolute;
  top: -3px;
  bottom: -3px;
  width: 1.5px;
  background: rgba(255,255,255,0.5);
  border-radius: 1px;
}
.mbm-agg-foot {
  display: flex;
  justify-content: space-between;
  margin-top: 7px;
  font-family: var(--mono);
  font-size: 10px;
  color: rgba(255,255,255,0.45);
}
.mbm-agg-track { color: #4ade80; }

.mbm-divider {
  height: 1px;
  background: rgba(255,255,255,0.06);
  margin: 0 14px;
}

.mbm-list {
  padding: 8px 8px;
  position: relative;
}
.mbm-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 8px;
  border-radius: 7px;
  gap: 10px;
}
.mbm-row:hover { background: rgba(255,255,255,0.04); }
.mbm-row.is-warn { background: rgba(245,158,11,0.06); }
.mbm-row.is-warn:hover { background: rgba(245,158,11,0.10); }
.mbm-row-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.mbm-dot {
  width: 8px; height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}
.mbm-row-meta { min-width: 0; }
.mbm-row-name {
  font-size: 12px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
  color: rgba(255,255,255,0.92);
}
.mbm-row-plan {
  font-family: var(--mono);
  font-size: 9px;
  color: rgba(255,255,255,0.4);
  padding: 1px 5px;
  background: rgba(255,255,255,0.05);
  border-radius: 3px;
  font-weight: 400;
  letter-spacing: 0;
}
.mbm-row-label {
  font-family: var(--mono);
  font-size: 10px;
  color: rgba(255,255,255,0.45);
  margin-top: 2px;
}
.mbm-row-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.mbm-row-pct {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  width: 48px;
  text-align: right;
}
.mbm-row-bar {
  width: 56px;
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  overflow: hidden;
}
.mbm-row-bar-fill {
  height: 100%;
  border-radius: 2px;
}

.mbm-footer {
  display: flex;
  gap: 6px;
  padding: 8px;
  position: relative;
}
.mbm-foot-btn {
  flex: 1;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.75);
  font-size: 11px;
  padding: 7px 10px;
  border-radius: 7px;
  font-weight: 500;
}
.mbm-foot-btn:hover {
  background: rgba(255,255,255,0.05);
  color: white;
}
.mbm-foot-quit {
  flex: 0 0 auto;
  font-family: var(--mono);
  width: 38px;
}

/* ========== Provider Strip ========== */
.section-provs {
  padding: 80px 0 30px;
  text-align: center;
}
.section-eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  margin-bottom: 14px;
}
.section-eyebrow .num {
  color: var(--accent);
}
.section-h2 {
  font-size: 36px;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin: 0 auto 18px;
  max-width: 640px;
  text-wrap: balance;
}
.section-lede {
  font-size: 16px;
  color: var(--ink-2);
  max-width: 540px;
  margin: 0 auto 40px;
  line-height: 1.5;
  letter-spacing: -0.01em;
}

.prov-strip {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 28px;
  box-shadow: var(--shadow-sm);
}
.prov-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 18px 14px;
}
.prov-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 8px 4px;
  border-radius: 10px;
  transition: background 0.2s;
}
.prov-tile:hover { background: var(--bg-2); }
.prov-mono {
  width: 42px;
  height: 42px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: -0.02em;
  font-family: var(--sans);
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.15);
}
.prov-name {
  font-size: 11px;
  color: var(--ink-2);
  font-weight: 500;
  letter-spacing: -0.005em;
}

/* ========== Features ========== */
.section-features {
  padding: 100px 0 40px;
}
.feat-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}
.feat-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr 1fr;
  box-shadow: var(--shadow-sm);
}
.feat-card.reverse {
  grid-template-columns: 1fr 1fr;
}
.feat-card.reverse .feat-text { order: 2; }
.feat-card.reverse .feat-visual { order: 1; }

.feat-text {
  padding: 44px 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.feat-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  margin-bottom: 14px;
}
.feat-tag .feat-num {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  background: rgba(234,88,12,0.1);
  display: grid;
  place-items: center;
  font-size: 10px;
}
.feat-h3 {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.025em;
  margin: 0 0 12px;
  line-height: 1.15;
}
.feat-p {
  font-size: 15px;
  color: var(--ink-2);
  line-height: 1.55;
  margin: 0 0 18px;
  letter-spacing: -0.01em;
}
.feat-bullets {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.feat-bullets li {
  display: flex;
  gap: 10px;
  font-size: 13px;
  color: var(--ink-2);
  align-items: flex-start;
}
.feat-bullets li::before {
  content: '';
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  margin-top: 8px;
}
.feat-visual {
  background:
    radial-gradient(ellipse at 50% 30%, rgba(124,58,237,0.08), transparent 60%),
    linear-gradient(135deg, #1a1622, #0f0d14);
  display: grid;
  place-items: center;
  padding: 36px;
  position: relative;
  overflow: hidden;
  min-height: 360px;
}
.feat-visual::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,0.04) 1px, transparent 0);
  background-size: 16px 16px;
}
.feat-visual.light-bg {
  background:
    radial-gradient(ellipse at 50% 0%, rgba(234,88,12,0.08), transparent 60%),
    linear-gradient(180deg, #f5f3ee, #e8e4db);
}

/* warning mockup */
.warn-pop {
  width: 340px;
  background: rgba(28, 22, 32, 0.92);
  backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 14px;
  color: white;
  filter: drop-shadow(0 24px 50px rgba(0,0,0,0.45));
  position: relative;
  z-index: 2;
}
.warn-banner {
  display: flex;
  gap: 10px;
  padding: 10px 12px;
  background: rgba(245,158,11,0.12);
  border: 1px solid rgba(245,158,11,0.3);
  border-radius: 8px;
  margin-bottom: 12px;
}
.warn-icon {
  font-size: 14px;
  color: #f59e0b;
  flex-shrink: 0;
  margin-top: 1px;
}
.warn-title {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 3px;
  letter-spacing: -0.005em;
}
.warn-sub {
  font-size: 11px;
  color: rgba(255,255,255,0.65);
  line-height: 1.45;
}
.warn-sub b { color: #fbbf24; font-weight: 600; }
.warn-chart {
  background: rgba(0,0,0,0.25);
  border-radius: 8px;
  padding: 6px;
  margin-bottom: 12px;
}
.warn-stats {

    border:.5px solid rgba(0,0,0,.1);border-radius:6px;padding:0;cursor:default;
    background:transparent;flex-shrink:0}
  .twk-swatch::-webkit-color-swatch-wrapper{padding:0}
  .twk-swatch::-webkit-color-swatch{border:0;border-radius:5.5px}
  .twk-swatch::-moz-color-swatch{border:0;border-radius:5.5px}
`;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

// =========================================================
// App + Tweaks
// =========================================================
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#ea580c",
  "showFlameRow": true,
  "heroLayout": "centered"
}/*EDITMODE-END*/;

const App = () => {
  const [tweaks, setTweak] = window.useTweaks ? window.useTweaks(TWEAK_DEFAULTS) : [TWEAK_DEFAULTS, () => {}];

  // Apply accent CSS var
  useEffect(() => {
    document.documentElement.style.setProperty('--accent', tweaks.accent);
    // derive a slightly lighter accent-2
    document.documentElement.style.setProperty('--accent-2', tweaks.accent);
  }, [tweaks.accent]);

  const TweaksPanel = window.TweaksPanel;
  const TweakSection = window.TweakSection;
  const TweakColor = window.TweakColor;
  const TweakToggle = window.TweakToggle;
  const TweakRadio = window.TweakRadio;

  return (
    <div className="page">
      <Nav/>
      <Hero accent={tweaks.accent}/>
      <ProviderSection/>
      <Features accent={tweaks.accent}/>
      <HowItWorks/>
      <FAQ/>
      <BottomCTA/>
      <Footer/>

      {TweaksPanel && (
        <TweaksPanel title="Tweaks">
          <TweakSection title="Brand">
            <TweakColor label="Accent color" value={tweaks.accent} onChange={(v) => setTweak('accent', v)}/>
          </TweakSection>
          <TweakSection title="Hero">
            <TweakToggle label="Decorative flame row" value={tweaks.showFlameRow} onChange={(v) => setTweak('showFlameRow', v)}/>
          </TweakSection>
        </TweaksPanel>
      )}

      {/* style tag controlled by tweaks */}
      <style>{`
        ${!tweaks.showFlameRow ? '.flame-row { display: none; }' : ''}
      `}</style>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
